# Use in-memory H2 for tests to avoid file locking issues
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.hibernate-orm.database.generation=drop-and-create
# Ephemeral HTTP port: avoids "Port already bound: 8081" when Quarkus restarts
# between test classes with different config (slow socket release races).
quarkus.http.test-port=0
